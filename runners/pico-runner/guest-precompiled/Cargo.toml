[workspace]

[package]
name = "pico-guest-precompiled"
version = "0.1.0"
edition = "2021"

[dependencies]
workloads-core = { path = "../../../crates/workloads-core", features = ["precompiles-enabled"] }

# Isolated root workspace for Pico precompile patches:
# [patch.crates-io]
# sha2 = { git = "https://github.com/brevis-network/RustCrypto-hashes", package = "sha2" }
# tiny-keccak = { git = "https://github.com/brevis-network/tiny-keccak" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
